- {ros_topic_name: "/gz/object_pose", gz_topic_name: "/model/rect_plate/pose", ros_type_name: "tf2_msgs/msg/TFMessage", gz_type_name: "gz.msgs.Pose_V", direction: GZ_TO_ROS}
