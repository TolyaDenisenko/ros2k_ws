Pipelines:
- name: object
  inputs: [ImageTopic]
  rate: 15
  infers:
    - name: ObjectDetection
      model: ~/.local/share/quasi/object_detection_model/model.xml
      engine: CPU
      label: ~/.local/share/quasi/object_detection_model/model.labels
      batch: 1
      confidence_threshold: 0.6
      enable_roi_constraint: true # set enable_roi_constraint to false if you don't want to make the inferred ROI (region of interest) constrained into the camera frame
  outputs: [RosService]
  connects:
    - left: ImageTopic
      right: [ObjectDetection]
#    - left: ObjectDetection
#      right: [ImageWindow]
    - left: ObjectDetection
      right: [RosService]

Common:
