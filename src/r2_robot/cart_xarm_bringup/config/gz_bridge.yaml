---
# gz_bridge для cart_xarm_bringup: тележка + xArm6 -> ROS 2 (общая часть: clock, колёса, езда, вакуум)
# /clock из Gazebo
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# /joint_states НЕ мостим: его публикует joint_state_broadcaster (ros2_control).
# Мост создавал второго издателя на том же топике.

# Углы ведущих колёс тележки (JointStatePublisher в cart_with_arm.urdf.xacro)
- ros_topic_name: "/cart/wheel_joint_states"
  gz_topic_name: "/model/cart/wheel_joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# Камера гриппера вынесена в gz_bridge_gripper_camera.yaml (Orbbec Gemini 335Le,
# топики /gripper_camera/...) и gz_bridge_d435i.yaml (старая RealSense D435i,
# топики /camera/...). Какой из них поднимать, решает launch по camera_model.

# ---------- Вакуумный гриппер (симуляция, DetachableJoint) ----------
# Плагин gz::sim::systems::DetachableJoint объявлен в cart-arm.xacro (внутри модели
# робота). Команда "attach" жёстко сваривает pick_box со звеном link6 (там лежит
# присоска), "detach" отпускает. Эти топики дёргает нода vacuum_gripper_sim
# (xarm_grasping), напрямую их дёргать только для отладки (docs/STATUS.md).
- ros_topic_name: "/vacuum/pick_box/attach"
  gz_topic_name: "/vacuum/pick_box/attach"
  ros_type_name: "std_msgs/msg/Empty"
  gz_type_name: "gz.msgs.Empty"
  direction: ROS_TO_GZ

- ros_topic_name: "/vacuum/pick_box/detach"
  gz_topic_name: "/vacuum/pick_box/detach"
  ros_type_name: "std_msgs/msg/Empty"
  gz_type_name: "gz.msgs.Empty"
  direction: ROS_TO_GZ

# Состояние соединения: плагин пишет строку "attached" / "detached"
- ros_topic_name: "/vacuum/pick_box/state"
  gz_topic_name: "/vacuum/pick_box/state"
  ros_type_name: "std_msgs/msg/String"
  gz_type_name: "gz.msgs.StringMsg"
  direction: GZ_TO_ROS

# Позы модели робота и объекта в мире (10 Гц, плагин PosePublisher в модели) ->
# tf2_msgs/TFMessage, имя модели в child_frame_id. vacuum_gripper_sim берёт из них
# мировую позу TCP и бокса, чтобы проверить касание присоской перед "attach".
# НЕ /tf: это не TF-дерево робота. (Полный /world/.../pose/info не мостим: сотни
# поз на каждом шаге — это 70% CPU у приёмника.)
- ros_topic_name: "/gz/robot_pose"
  gz_topic_name: "/cart_xarm6/pose"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

- ros_topic_name: "/gz/object_pose"
  gz_topic_name: "/model/pick_box/pose"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

# ---------- Езда тележки (VelocityControl / OdometryPublisher из cart-sensors.ign.xacro) ----------
- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/model/cart/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/odom"
  gz_topic_name: "/model/cart/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS
