# Объекты сцены «рука на столе» — ЕДИНСТВЕННЫЙ источник списка.
# Отсюда читает arm_table_gz.launch.py (vacuum_targets, vacuum_gripper_sim,
# scene_markers), а мир (worlds/arm_table.world) и мост
# (config/gz_bridge_arm_table.yaml) генерирует tools/gen_arm_table_scene.py:
#   python3 src/r2_robot/cart_xarm_bringup/tools/gen_arm_table_scene.py
# После правки — запустить генератор и пересобрать (новые файлы не нужны,
# --symlink-install подхватит).
#
# name  — имя модели в Gazebo = класс в xarm_grasping/config/objects.yaml
# shape — box | cylinder | pyramid
# size  — box: [X, Y, Z]; cylinder: [радиус, высота]; pyramid: [сторона основания X, Y, высота], м
#         (пирамида — четырёхугольная, сетка worlds/meshes/pyramid.obj, генерируется)
# xy    — центр на столе в link_base (верх стола z=0), м; yaw — рад
# mass  — кг
# Прежний набор из 8 предметов (мелкие коробки/цилиндры): config/arm_table_objects_8_old.yaml
objects:
  - {name: cube,          shape: box,      size: [0.06, 0.06, 0.06], xy: [0.50, 0.00],  yaw: 0.3, mass: 0.10}
  - {name: parallelepiped, shape: box,     size: [0.12, 0.05, 0.07], xy: [0.45, 0.18],  yaw: 0.0, mass: 0.15}
  - {name: rect_plate,    shape: box,      size: [0.14, 0.09, 0.02], xy: [0.25, -0.05],  yaw: 0.0, mass: 0.12}
  - {name: cylinder,      shape: cylinder, size: [0.04, 0.10],       xy: [0.35, -0.20], yaw: 0.0, mass: 0.12}
