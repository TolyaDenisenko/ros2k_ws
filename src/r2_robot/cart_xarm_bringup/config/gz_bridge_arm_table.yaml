- {ros_topic_name: "/vacuum/cylinder/attach", gz_topic_name: "/vacuum/cylinder/attach", ros_type_name: "std_msgs/msg/Empty", gz_type_name: "gz.msgs.Empty", direction: ROS_TO_GZ}
