---
# gz_bridge для cart_xarm_bringup: тележка + xArm6 (камера на ЭФ) -> ROS 2
# /clock из Gazebo
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# /joint_states НЕ мостим: его публикует joint_state_broadcaster (ros2_control).
# Мост создавал второго издателя на том же топике.

# Углы ведущих колёс тележки (JointStatePublisher в cart_with_arm.urdf.xacro)
- ros_topic_name: "/cart/wheel_joint_states"
  gz_topic_name: "/model/cart/wheel_joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# ---------- Камера гриппера (Realsense D435i, realsense_gz из xarm_description) ----------
# Цветное изображение
- ros_topic_name: "/camera/color/image_raw"
  gz_topic_name: "/camera/color/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/color/camera_info"
  gz_topic_name: "/camera/color/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# Глубина
- ros_topic_name: "/camera/depth/depth_info"
  gz_topic_name: "/camera/depth/depth_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# Облако точек RGBD-сенсора (rgbd_camera сам публикует points в Gazebo Harmonic)
- ros_topic_name: "/camera/depth/points"
  gz_topic_name: "/camera/depth/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

# ---------- Езда тележки (VelocityControl / OdometryPublisher из cart-sensors.ign.xacro) ----------
- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/model/cart/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/odom"
  gz_topic_name: "/model/cart/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS
