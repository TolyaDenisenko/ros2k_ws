- {ros_topic_name: "/vacuum/rect_plate/attach", gz_topic_name: "/vacuum/rect_plate/attach", ros_type_name: "std_msgs/msg/Empty", gz_type_name: "gz.msgs.Empty", direction: ROS_TO_GZ}
