# СГЕНЕРИРОВАНО tools/gen_arm_table_scene.py из config/arm_table_objects.yaml — не править руками.
# gz_bridge сценария «рука на столе»: /clock, поза руки, вакуум и поза каждого объекта.
# Камера гриппера — gz_bridge_gripper_camera.yaml (общий с тележкой).
# /clock_gz -> /clock (200 Гц) прореживает clock_throttle, см. gz_bridge.yaml
- {ros_topic_name: "/clock_gz", gz_topic_name: "/clock", ros_type_name: "rosgraph_msgs/msg/Clock", gz_type_name: "gz.msgs.Clock", direction: GZ_TO_ROS}
- {ros_topic_name: "/gz/robot_pose", gz_topic_name: "/xarm6_table/pose", ros_type_name: "tf2_msgs/msg/TFMessage", gz_type_name: "gz.msgs.Pose_V", direction: GZ_TO_ROS}
# pick_box
- {ros_topic_name: "/vacuum/pick_box/attach", gz_topic_name: "/vacuum/pick_box/attach", ros_type_name: "std_msgs/msg/Empty", gz_type_name: "gz.msgs.Empty", direction: ROS_TO_GZ}
- {ros_topic_name: "/vacuum/pick_box/detach", gz_topic_name: "/vacuum/pick_box/detach", ros_type_name: "std_msgs/msg/Empty", gz_type_name: "gz.msgs.Empty", direction: ROS_TO_GZ}
- {ros_topic_name: "/vacuum/pick_box/state", gz_topic_name: "/vacuum/pick_box/state", ros_type_name: "std_msgs/msg/String", gz_type_name: "gz.msgs.StringMsg", direction: GZ_TO_ROS}
- {ros_topic_name: "/gz/object_pose", gz_topic_name: "/model/pick_box/pose", ros_type_name: "tf2_msgs/msg/TFMessage", gz_type_name: "gz.msgs.Pose_V", direction: GZ_TO_ROS}
