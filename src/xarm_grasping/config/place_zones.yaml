# Зоны установки на столе (scene_manager.py, action FindPlacePose / PickPlace).
# Координаты — в base_frame (link_base): для сцены «рука на столе» (arm_table.world)
# верх стола z=0, объекты стоят в 0.35–0.45 м перед базой.
#   center [x, y], size [по X, по Y] — прямоугольник на столе, м;
#   accepts — категории/классы объектов (objects.yaml), которые сюда ставятся;
#             первая подходящая зона используется, если в запросе зона не задана.
# Зоны видны в RViz (дисплей PlaceZones, /place_zones/markers).
frame: link_base
# Зоны — в поле зрения камеры из позы наблюдения (камера стоит боком: по Y видит
# ~±0.47 м, по X ~0.07..0.65): у края кадра объекты распознаются частично, и поиск
# места не видел уже поставленных (2026-10-22).
zones:
  zone_boxes:
    center: [0.32, 0.32]
    size: [0.38, 0.20]
    accepts: [box]
    color: [0.2, 0.5, 1.0]
  zone_cylinders:
    center: [0.32, -0.33]
    size: [0.40, 0.20]
    accepts: [cylinder]
    color: [1.0, 0.5, 0.1]
# Поиск свободного места: шаг сетки внутри зоны, зазор между объектами, м
# (объект в присоске может сидеть на 1–2 см не по центру; при 3 см соседние
# цилиндры в зоне сливались в один кластер)
search_step: 0.01
clearance: 0.04
