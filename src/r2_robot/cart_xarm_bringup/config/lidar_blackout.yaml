# Сектора лидара, закрытые стойками тележки (scripts/lidar_blackout_filter.py).
# Значения — из quasi_ros_c1 quasi_cart_bringup/param/ydlidar.yaml (blackout_angles
# драйвера ydlidar). Для c2 и c2l-v3 своих значений в c1 нет — действует общий
# набор; у c2m-v3 свои (c2m-v3.quasi_common.yaml) — добавить при поддержке модели.
# Набор симметричен относительно 0 и pi, поэтому совпадает и в кадре драйвера,
# и в lidar_link (лидар перевёрнут: rpy pi 0 pi).
#
# Проверка в gz (c2l-v3, 2026-10-28): стойки видны на 0.46 м в секторах
# 30.0..35.6, 144.3..150.1, 209.9..215.7, 324.4..330.0 град — все внутри.
lidar_blackout_filter:
  ros__parameters:
    #                  FR                       RR                     RL                     FL
    #                  25.3..37.5               142.2..154.5           205.5..217.8           322.8..334.8 град
    blackout_angles: [0.4415683, 0.6544985,   2.4818582, 2.6965337,   3.5866516, 3.8013271,   5.6339228, 5.8433623]
