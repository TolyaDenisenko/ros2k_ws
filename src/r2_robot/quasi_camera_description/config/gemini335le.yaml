# Параметры камеры Orbbec Gemini 335Le (источник: docs/01 и паспорт камеры).
# Читается xacro-макросом gz_rgbd_camera (urdf/gz/gz_rgbd_camera.xacro).

# Что ставить в симуляции. Основной режим захвата (документ 01, раздел 4).
sim:
  hfov: 1.5708          # 90° — FOV глубины (у цвета 94°; берём меньший: там есть выровненная глубина)
  width: 1280
  height: 800
  rate: 15.0            # Гц. Для статичной сцены захвата хватает, вдвое легче 30 Гц
  near: 0.25            # мин. дальность глубины камеры, м (мёртвая зона!)
  far: 6.0              # идеальная дальность, м
  depth_noise_std: 0.002   # м. Реальная σ на 0.5 м ~0.3 мм, на 1 м ~1.3 мм; 2 мм — с запасом
  color_noise_std: 0.007

# Лёгкий режим отладки движений (gripper_camera_preview:=true), меньше нагрузка на GPU и мост.
sim_preview:
  hfov: 1.5708
  width: 640
  height: 400
  rate: 15.0
  near: 0.25
  far: 6.0
  depth_noise_std: 0.002
  color_noise_std: 0.007

# Заметки для железа (документ 02)
hardware:
  recommended_firmware: "1.8.10"
