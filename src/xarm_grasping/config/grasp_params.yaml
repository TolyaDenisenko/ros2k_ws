# Параметры узла grasp_analyzer. Имена ТОЧНО совпадают с declare_parameter()
# в scripts/grasp_analyzer.py — иначе ROS отклонит параметр (undeclared).
#
# Главный launch (cart_xarm6_gz.launch.py) этот файл НЕ читает — он задаёт
# параметры сам. Файл — для ручного запуска рядом с работающей симуляцией:
#   ros2 run xarm_grasping grasp_analyzer.py --ros-args \
#       --params-file src/xarm_grasping/config/grasp_params.yaml
#
# Значения — для дефолтной сцены cart_xarm6_gz: тележка c2l-v3-scaled,
# спавн (-0.3,0), камера Orbbec Gemini 335Le, мир cart_table_offline.world.
grasp_analyzer:
  ros__parameters:
    use_sim_time: true
    # --- камера гриппера (единые имена /gripper_camera/...) ---
    color_topic: /gripper_camera/color/image_raw
    points_topic: /gripper_camera/points
    camera_frame: gripper_camera_color_optical_frame
    base_frame: link_base            # TF-фрейм основания руки
    # --- геометрия сцены (метрические значения в base_frame) ---
    # link_base в мире ≈ (-0.54, -0.135, 0.910); верх стола z=0.925
    table_height: 0.015              # z столешницы относительно link_base
    block_radius: 0.04               # ожидаемый радиус цилиндра (априори;
    block_height: 0.09               #   реальные размеры находятся из облака точек)
    block_x: 1.14                    # запасная позиция объекта (pick_box 0.60,0 в мире),
    block_y: 0.135                   #   если сегментация ещё не нашла объект
    # --- вакуумная присоска и подходы ---
    suction_radius: 0.02             # r пятна присоски; боковой захват возможен
                                     # только при R_блока >= ~2*r (ограничение генератора)
    approach_offset: 0.10            # pre-grasp: отход вдоль оси подхода, м
    # --- параметры сегментации облака точек ---
    voxel_size: 0.01                 # дискретизация перед поиском кластеров
    min_points: 150                  # минимум точек в кластере, чтобы считать блоком
    analyze_period: 2.0              # период анализа, сек
