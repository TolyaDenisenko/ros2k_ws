perception:
  ros__parameters:
    frame_id: base_footprint    # center of the robot projected to ground plane
    pointcloud_topic: /realsense/depth/color/points
    color_camera_info_topic: /realsense/color/camera_info
    object_detection_service: /openvino_image_object_server/service
    object_types_file_path: ~/.local/share/quasi/object_detection_model/model_objects.json
    object_recognition_timeout: 10000
    cloud_segmentation_timeout: 8000
    use_bond: false
    plane_angle_threshold: 0.1
    plane_distance_threshold: 0.02
    plane_points_threshold: 6000
    area_height_threshold: 0.05
    cluster_tolerance: 0.025
    cluster_min_size: 100
    min_roi_intersection: 0.5    # min intersection of segment with object ROI in [0...1] range
    roi_intersection_search_radius: 0.002
    primitive_size_padding: 0.002 # padd detected primitive shape sizes by this value
    use_cloud_viewer: false
    default_workspace:
      width: 1.2      # centered at robot center
      length: 1.3     # ahead from robot center
      height: 1.4     # up from the origin (ground)
      origin_z: 0.0   # offset from the ground
    gripper_outer_radius: 0.11  # outer radius of the gripper in open position centered between fingertips
    max_place_poses: 10         # maximum number of object placement poses to return
    num_samples: 100            # number of random samples taken from the plane cloud to search for empty spots
    z_padding: 0.03             # z-axis offset to avoid hitting surface
    save_object_clouds: /tmp
